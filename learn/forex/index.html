<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Learn forex trading from foundations to quantitative risk management. 19 modules with searchable topic pages and progress tracking."><title>Forex Trading Academy | Learn with Mynul</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2d;--panel2:#1b2740;--text:#eaf1ff;--muted:#a8b6d1;--line:#30405d;--accent:#64d5b1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}.sidebar{height:100vh;overflow:auto;position:sticky;top:0;background:#10182a;border-right:1px solid var(--line);padding:22px}.brand{font-weight:800;font-size:19px}.brand small{display:block;color:var(--accent);font-size:11px;letter-spacing:2px;text-transform:uppercase}.back{display:block;color:var(--muted);margin:18px 0}input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text)}.progress{height:7px;background:var(--panel2);border-radius:20px;overflow:hidden;margin:10px 0}.progress div{height:100%;background:var(--accent);transition:width .2s}.small{color:var(--muted);font-size:12px}.module{border-bottom:1px solid var(--line)}.module summary{padding:13px 4px;cursor:pointer;font-weight:650}.module summary:hover,.topic:hover{color:var(--accent)}.topic{display:block;padding:7px 10px 7px 24px;color:var(--muted);font-size:13px;border-radius:7px}.topic.active{color:var(--accent);background:#203449}.main{max-width:1080px;width:100%;margin:0 auto;padding:44px clamp(22px,5vw,76px)}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:750}h1{font-size:clamp(30px,4vw,52px);line-height:1.15;letter-spacing:-1.4px;margin:14px 0}h2{font-size:23px;margin-top:30px}p{color:var(--muted)}.hero{padding:35px 0 25px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card,.lessonbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.card{display:block;transition:border-color .15s,transform .15s}.card:hover{border-color:var(--accent);transform:translateY(-2px)}.card h3{font-size:18px;line-height:1.4}.card p{font-size:13px}.lessonbox{margin:18px 0}.lessonbox h2{margin-top:0}.lessonbox ul{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.btn{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:11px 16px}.btn.primary{background:var(--accent);color:#071b19;border-color:var(--accent);font-weight:750}.lessonlist{display:grid;gap:8px}.lessonlist a{padding:12px;border:1px solid var(--line);border-radius:9px}.lessonlist a:hover{border-color:var(--accent)}.warning{border-left:3px solid #f0bb69;padding:12px 18px;background:#2b2530;color:#e6d6c0}.mobiletoggle{display:none}.breadcrumbs{font-size:13px;color:var(--muted)}.breadcrumbs a{color:var(--accent)}.muted{color:var(--muted)}@media(max-width:800px){.layout{display:block}.sidebar{display:none;position:relative;height:auto;max-height:70vh}.sidebar.open{display:block}.mobiletoggle{display:block;position:sticky;top:0;width:100%;z-index:2;background:#16233a;color:white;border:0;padding:12px;text-align:left}.main{padding:24px 18px}.cards{grid-template-columns:1fr}}
</style></head><body><button class="mobiletoggle" id="menu" aria-expanded="false">☰ Browse 19 modules and topics</button><div class="layout"><aside class="sidebar" id="sidebar"><a class="brand" href="../index.html">Learn with Mynul<small>Forex Trading Academy</small></a><a class="back" href="../index.html">← All learning tracks</a><input id="search" type="search" placeholder="Search modules and topics…" aria-label="Search curriculum"><div style="margin-top:18px" class="small" id="counter"></div><div class="progress"><div id="bar"></div></div><nav id="nav" aria-label="Curriculum"></nav></aside><main class="main" id="content" tabindex="-1"></main></div><script>
const modules=[{"name":"Forex Trading Foundations","topics":["What forex trading is and how currency markets operate","Currency pairs: major, minor and exotic","Base currency and quote currency","Bid, ask and spread","Pips, pipettes and pip value","Lot sizes: standard, mini, micro and nano","Leverage and margin","Equity, balance, free margin and margin level","Margin calls, stop-outs and negative balance protection","Long and short positions","Market, limit, stop and stop-limit orders","Stop-loss, take-profit and trailing stops","Swap, rollover, commissions and financing costs","Trading sessions: Sydney, Tokyo, London and New York","Trading platforms: MetaTrader 4/5 and TradingView","Broker models, regulation and counterparty risk"]},{"name":"Market Mechanics and Microstructure","topics":["OTC forex market structure","Spot forex, forwards, futures, options and CFDs","Banks, dealers, liquidity providers and retail brokers","Interbank market and market makers","Market orders versus resting orders","Liquidity, depth and order books","Slippage and execution latency","Spread widening and volatile market conditions","Bid-ask dynamics","Order flow and price discovery","Market impact and transaction costs","Centralized futures volume versus decentralized spot forex","Liquidity fragmentation and trading venue differences"]},{"name":"Candlesticks and Chart Reading","topics":["OHLC prices and candle anatomy","Bullish and bearish candles","Body, wick and range","Doji, hammer, shooting star and engulfing patterns","Inside bars and outside bars","Pin bars and rejection candles","Momentum and indecision candles","Chart types: line, bar, candlestick and Heikin Ashi","Linear versus logarithmic price scales","Timeframes and candle aggregation","Support and resistance basics","Trendlines and price channels","Gaps and volatility expansion"]},{"name":"Market Structure and Trends","topics":["Uptrend, downtrend and sideways markets","Higher highs and higher lows","Lower highs and lower lows","Swing highs and swing lows","Internal versus external market structure","Break of Structure (BOS)","Change of Character (CHoCH)","Market Structure Shift (MSS)","Trend continuation and trend exhaustion","Pullbacks and retracements","Breakouts and false breakouts","Reversals versus corrections","Consolidation and range boundaries","Impulse and corrective movements","Fractal market structure","Objective swing identification rules"]},{"name":"Liquidity and Smart Money Concepts","topics":["Buy-side and sell-side liquidity","Resting stop orders and liquidity pools","Equal highs and equal lows","Previous day and week highs/lows","Liquidity sweeps and stop runs","Liquidity grabs versus genuine breakouts","Internal and external liquidity","Inducement and trapped traders","Displacement and price inefficiency","Fair Value Gaps (FVG)","Inverse FVG and balanced price ranges","Order blocks and breaker blocks","Mitigation blocks","Premium, discount and equilibrium","Consequent encroachment","Supply and demand zones","Institutional order execution concepts","Limits of inferring institutional intent from retail charts"]},{"name":"ICT Trading Frameworks","topics":["ICT terminology and market narrative","Dealing ranges and equilibrium","Daily bias and draw on liquidity","Power of Three: accumulation, manipulation, distribution","Judas swing","London and New York kill zones","Asian session range","Opening range concepts","Optimal Trade Entry (OTE)","Market Maker Buy Model and Sell Model","Silver Bullet setup","Turtle Soup setup","Liquidity sweep plus MSS plus FVG setup","Daily and weekly profiles","Time and price theory","Session-specific execution rules","Testing ICT claims objectively"]},{"name":"Price Action and Classical Technical Analysis","topics":["Horizontal support and resistance","Dynamic support and resistance","Supply and demand","Breakout, retest and rejection setups","Double tops and double bottoms","Head and shoulders patterns","Triangles, flags, wedges and rectangles","Trendline breaks","Fibonacci retracements and extensions","Moving averages: SMA and EMA","RSI and momentum divergence","MACD and momentum shifts","Bollinger Bands","ATR and volatility measurement","ADX and trend strength","Volume and tick volume","VWAP and volume profile using appropriate market data","Indicator lag and overfitting","Evidence behind chart-pattern performance"]},{"name":"Multi-Timeframe and Session Analysis","topics":["Top-down analysis","Monthly, weekly and daily context","4-hour and 1-hour structure","15-minute, 5-minute and 1-minute execution charts","Higher-timeframe directional bias","Lower-timeframe confirmation","Timeframe alignment and conflicts","London session behavior","New York session behavior","London-New York overlap","Asian session ranges","Daylight saving time differences","Session highs and lows","Daily and weekly opening prices","Trading around economic releases","Session-specific spread and volatility changes"]},{"name":"Fundamental Analysis and Macroeconomics","topics":["Interest rates and interest-rate differentials","Central bank monetary policy","Federal Reserve, ECB, BoE and BoJ","Inflation: CPI, core CPI and PPI","Employment: NFP, unemployment and wages","GDP and economic growth","PMI, retail sales and consumer confidence","Bond yields and yield curves","Real interest rates","Monetary tightening and easing","Quantitative easing and tightening","Hawkish versus dovish guidance","Currency carry trades","Risk-on and risk-off environments","Safe-haven currency behavior","Trade balances and capital flows","Commodity-linked currencies","Geopolitical risk and market shocks","Economic calendar expectations versus actual results","Central bank communication and forward guidance","Macroeconomic regime changes"]},{"name":"Risk and Capital Management","topics":["Risk per trade as a percentage of equity","Position sizing and pip-value calculations","Risk-reward ratios: 1:1, 1:2, 1:3 and 1:5","R-multiples","Expected value and expectancy","Win rate versus payoff ratio","Break-even win rate after costs","Maximum drawdown","Risk of ruin","Consecutive-loss probabilities","Daily, weekly and monthly loss limits","Correlation across currency pairs","Aggregate exposure and concentration","Leverage and effective leverage","Stop-loss placement and volatility","ATR-based position sizing","Fixed fractional sizing","Volatility targeting","Portfolio-level risk limits","Black swan events and gap risk","Stress testing and scenario analysis","Capital preservation and compounding mathematics"]},{"name":"Trading Psychology and Decision-Making","topics":["Fear and greed","FOMO and revenge trading","Overtrading","Loss aversion","Confirmation bias","Recency bias and hindsight bias","Overconfidence and gambler's fallacy","Sunk-cost fallacy","Discipline and rule adherence","Patience and selective execution","Emotional responses to drawdowns","Decision fatigue","Process goals versus profit goals","Pre-trade and post-trade checklists","Trading journals and self-review","Recognizing when not to trade"]},{"name":"Strategy Design and Trading Systems","topics":["Defining a measurable trading hypothesis","Trend-following strategies","Mean-reversion strategies","Breakout and momentum strategies","Range trading strategies","News-event strategies and their risks","Scalping, day trading, swing trading and position trading","Entry triggers and confirmations","Stop-loss and exit rules","Profit targets and trailing exits","Time-based exits","No-trade filters","Market regime filters","Risk-reward and expectancy requirements","Precise rule-based strategy documentation","Discretionary versus systematic trading","Avoiding excessive strategy complexity"]},{"name":"Backtesting and Statistical Validation","topics":["Historical data quality and limitations","Bid-ask data versus midpoint data","Backtesting methodology","In-sample and out-of-sample testing","Walk-forward validation","Look-ahead bias and data leakage","Survivorship and selection bias","Overfitting and multiple testing","Sample size and statistical uncertainty","Win rate, average win and average loss","Profit factor and expectancy","Sharpe and Sortino ratios","Maximum drawdown and recovery factor","Equity curves and return distributions","Monte Carlo simulations","Bootstrapping trade outcomes","Sensitivity and robustness testing","Spread, slippage and commission modeling","Regime-specific performance analysis","Forward testing on a demo account"]},{"name":"Trade Management and Execution","topics":["Pre-trade planning","Market versus pending-order execution","Entry timing and spread checks","Partial exits and scaling out","Scaling in and pyramiding","Break-even stop rules","Trailing-stop techniques","Time stops","Handling partial fills and rejected orders","Managing positions during news","Slippage and execution quality","Trading around weekend gaps","Trade cancellation and invalidation rules","Managing simultaneous positions","Trade review and execution-error analysis"]},{"name":"Quantitative and Algorithmic Trading","topics":["Probability and descriptive statistics","Conditional probability and Bayes' theorem","Distributions, variance and standard deviation","Hypothesis testing and confidence intervals","Time-series analysis","Autocorrelation and stationarity","Volatility clustering","Regime detection","Correlation versus causation","Python for trading research","Pandas, NumPy and data visualization","API-based market data collection","Event-driven backtesting","Algorithmic execution","Transaction-cost models","Automated risk controls","Monitoring and failure handling","Machine learning limitations in financial markets","Model drift and retraining","Paper trading automated strategies"]},{"name":"Advanced Market and Portfolio Risk","topics":["Currency exposure decomposition","Cross-pair correlations","Portfolio diversification","Volatility regimes","Value at Risk (VaR)","Expected Shortfall (CVaR)","Tail risk and extreme market events","Liquidity risk","Counterparty and broker failure risk","Currency pegs and central-bank interventions","Weekend and overnight gap exposure","Stress scenarios and leverage shocks","Position limits and drawdown controls","Risk-adjusted return comparison","Portfolio rebalancing"]},{"name":"Trading Operations, Regulation and Security","topics":["Broker licensing and regulatory checks","German and EU retail CFD protections","ESMA leverage limits and risk warnings","Understanding CFDs versus spot forex and futures","Broker fees and conflict-of-interest disclosures","Client-money protection and compensation limitations","Tax recordkeeping and German tax obligations","Trade confirmations and account reconciliation","Platform security and two-factor authentication","Withdrawal and deposit verification","Trading scams and fake performance statements","Copy-trading risks and signal-provider incentives","Trading plan documentation","Operational contingency planning"]},{"name":"Professional Performance Review","topics":["Trading journal design","Strategy-specific performance attribution","Weekly and monthly scorecards","Trade tagging by setup and market regime","Mistake classification","Rule adherence percentage","Net expectancy after all costs","Rolling drawdown and rolling expectancy","Confidence intervals for performance","Benchmark comparison","Strategy degradation detection","Deciding when to pause or retire a strategy","Independent verification of results","Scaling capital only after robust validation"]},{"name":"Professional Readiness and Integration","topics":["Connecting macroeconomic context with technical setups","Choosing a limited set of currency pairs","Defining one complete written trading plan","Documenting objective entry and exit criteria","Explaining the source of a proposed trading edge","Calculating position size without guessing","Understanding every relevant broker cost","Knowing what invalidates a strategy","Creating a demo-testing protocol","Defining maximum acceptable drawdown","Creating an emergency stop-trading procedure","Understanding the limitations of historical results","Separating learning progress from income expectations"]}];
const lessons=modules.flatMap((m,i)=>m.topics.map((title,j)=>({title,i,j,id:i+"-"+j})));
const storageKey="mynul-forex-academy-v1";
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem(storageKey)||"[]"))}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isDetailed=(i,j)=>(i===0&&j>=0&&j<16)||(i===1&&j>=0&&j<13)||(i===2&&j>=0&&j<6);
const url=(i,j)=>isDetailed(i,j)?"lesson-"+String(i===1?17+j:j+1).padStart(3,"0")+".html":"#/lesson/"+i+"/"+j;
function progress(){document.getElementById("counter").textContent=done.size+" / "+lessons.length+" topics marked complete";document.getElementById("bar").style.width=(done.size/lessons.length*100)+"%"}
function nav(){let q=document.getElementById("search").value.toLowerCase().trim();document.getElementById("nav").innerHTML=modules.map((m,i)=>{let hits=m.topics.map((t,j)=>({t,j})).filter(x=>!q||m.name.toLowerCase().includes(q)||x.t.toLowerCase().includes(q));if(!hits.length)return "";return '<details class="module" '+(q?'open':'')+'><summary>'+String(i+1).padStart(2,"0")+' · '+esc(m.name)+'</summary>'+hits.map(x=>'<a class="topic" href="'+url(i,x.j)+'">'+(done.has(i+"-"+x.j)?"✓ ":"")+esc(x.t)+(isDetailed(i,x.j)?" · FULL LESSON":" · OUTLINE")+'</a>').join("")+'</details>'}).join("")}
function header(kicker,title,desc){return '<div class="hero"><div class="eyebrow">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'}
function render(){let parts=location.hash.slice(2).split("/");if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="0"){location.replace("lesson-001.html");return;}if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="1"){location.replace("lesson-002.html");return;}if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="2"){location.replace("lesson-003.html");return;}if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="3"){location.replace("lesson-004.html");return;}if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="4"){location.replace("lesson-005.html");return;}if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="5"){location.replace("lesson-006.html");return;}if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="6"){location.replace("lesson-007.html");return;}if(parts[0]==="lesson"&&parts[1]==="0"&&parts[2]==="7"){location.replace("lesson-008.html");return;}let content=document.getElementById("content");if(parts[0]==="lesson"){let i=+parts[1],j=+parts[2],m=modules[i];if(!m||!m.topics[j]){location.hash="#/";return}let title=m.topics[j],id=i+"-"+j,k=lessons.findIndex(x=>x.id===id),prev=lessons[k-1],next=lessons[k+1];content.innerHTML='<div class="breadcrumbs"><a href="#/">Academy</a> / <a href="#/module/'+i+'">'+esc(m.name)+'</a> / Lesson '+(j+1)+'</div>'+header("Module "+String(i+1).padStart(2,"0")+" · Lesson "+(j+1),title,"A structured learning workspace for this subject.")+'<div class="lessonbox"><h2>Learning objectives</h2><ul><li>Define '+esc(title)+' accurately in the context of forex markets.</li><li>Explain where this concept fits in a complete trading decision.</li><li>Identify the assumptions, limitations and risks of using this concept.</li><li>Describe how you would test or verify it using historical data or a demo account.</li></ul></div><div class="lessonbox"><h2>Study guide</h2><p>Start by writing a precise definition of <strong>'+esc(title)+'</strong>. Identify the market data or account information needed to observe it. Distinguish a descriptive observation from a predictive claim. Note which trading costs, leverage effects and market conditions could change the outcome.</p><p>For any proposed setup, specify an observable trigger, invalidation condition, risk limit and exit rule before assessing its performance. A chart example alone does not establish a repeatable edge.</p></div><div class="lessonbox"><h2>Mastery check</h2><ol><li>Explain this topic to a beginner without jargon.</li><li>Give one realistic market example and one counterexample.</li><li>What could make the concept misleading or unreliable?</li><li>How would you measure whether it improves a trading strategy after costs?</li></ol><p class="small">This is a guided topic outline. Full instructor-written explanations, worked examples and graded quizzes are not yet published for every lesson.</p></div><div class="warning">Educational material only. Forex and leveraged CFDs can cause substantial losses. No strategy or course guarantees profit.</div><div class="actions"><button class="btn primary" id="complete">'+(done.has(id)?"✓ Completed · Undo":"Mark lesson complete")+'</button>'+(prev?'<a class="btn" href="'+url(prev.i,prev.j)+'">← Previous</a>':'')+(next?'<a class="btn" href="'+url(next.i,next.j)+'">Next lesson →</a>':'')+'</div>';document.getElementById("complete").onclick=()=>{done.has(id)?done.delete(id):done.add(id);localStorage.setItem(storageKey,JSON.stringify([...done]));progress();nav();render()}}else if(parts[0]==="module"){let i=+parts[1],m=modules[i];if(!m){location.hash="#/";return}content.innerHTML='<div class="breadcrumbs"><a href="#/">Academy</a> / Module '+(i+1)+'</div>'+header("Module "+String(i+1).padStart(2,"0"),m.name,m.topics.length+" lessons · Follow in order or open any topic.")+'<div class="lessonlist">'+m.topics.map((t,j)=>'<a href="'+url(i,j)+'">'+(done.has(i+"-"+j)?"✓ ":"")+String(j+1).padStart(2,"0")+' · '+esc(t)+(isDetailed(i,j)?' · FULL LESSON':' · OUTLINE')+' →</a>').join("")+'</div>'}else{content.innerHTML=header("Learn with Mynul · Structured curriculum","Forex Trading Academy","From first principles to market structure, risk management, quantitative research and professional performance review. Study at your own pace.")+'<div class="stats"><span class="pill">19 modules</span><span class="pill">'+lessons.length+' topics</span><span class="pill">Individual lesson routes</span><span class="pill">Progress saved on this device</span></div><div class="warning">This academy is an educational syllabus with guided lesson outlines, not a verified professional certification or a promise of trading profitability.</div><div class="warning"><strong>Professional FX Mastery Standard:</strong> Study evidence-based market analysis, institutional FX mechanics, quantitative validation and practical assessments. <a href="mastery-standard.html" style="color:var(--accent);text-decoration:underline">Read the full mastery standard and research roadmap →</a><p><a href="quant-research-lab.html" style="color:var(--accent);text-decoration:underline">Open the interactive Forex Quantitative Research &amp; Verification Lab →</a></p></div><h2>Explore the curriculum</h2><div class="cards">'+modules.map((m,i)=>'<a class="card" href="#/module/'+i+'"><span class="eyebrow">Module '+String(i+1).padStart(2,"0")+'</span><h3>'+esc(m.name)+'</h3><p>'+m.topics.length+' topics · '+m.topics.filter((_,j)=>done.has(i+"-"+j)).length+' completed</p><span style="color:var(--accent)">Explore lessons →</span></a>').join("")+'</div>'}document.querySelectorAll(".topic").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===location.hash));document.title=(parts[0]==="lesson"&&modules[+parts[1]]?.topics[+parts[2]]?modules[+parts[1]].topics[+parts[2]]+" | ":"")+"Forex Trading Academy | Learn with Mynul";document.getElementById("sidebar").classList.remove("open");document.getElementById("menu").setAttribute("aria-expanded","false");window.scrollTo(0,0)}
document.getElementById("search").addEventListener("input",nav);document.getElementById("menu").onclick=()=>{let el=document.getElementById("sidebar");el.classList.toggle("open");document.getElementById("menu").setAttribute("aria-expanded",String(el.classList.contains("open")))};window.addEventListener("hashchange",render);progress();nav();render();
</script></body></html>
